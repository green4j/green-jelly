plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id 'checkstyle'
    id 'jacoco'
}

def projectVersion = file('version.txt').text.trim()

group = projectGroup
version = projectVersion

defaultTasks 'clean', 'build'

def getConfigProperty(final String propertyName) {
    String value = project.findProperty(propertyName)
    if (!value) {
        value = System.getenv(propertyName)
        if (!value) {
            return null
        }
    }
    return value.trim()
}

ext {
    jellySrcJavaVersion = JavaVersion.toVersion(srcJavaVersion)

    // The JDK javac, the tests, javadoc, checkstyle and the jacoco agent run on. CI just runs Gradle itself
    // on the JDK of the matrix job, so this defaults to it; the property is for building against another
    // JDK locally without switching JAVA_HOME.
    buildJavaVersion = (project.findProperty('buildJavaVersion')
            ?: JavaVersion.current().majorVersion) as Integer

    isRelease = !projectVersion.endsWith('-SNAPSHOT')

    sonatypeReleasesRepoUrl = isRelease
            ? 'https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/'
            : 'https://central.sonatype.com/repository/maven-snapshots/'

    sonatypeUsername = getConfigProperty('SONATYPE_USERNAME')
    sonatypePassword = getConfigProperty('SONATYPE_PASSWORD')

    signingKey = getConfigProperty('SIGNING_GPG_SECRET_KEY')    // ascii-armored secret key
    signingPassword = getConfigProperty('SIGNING_GPG_PASSWORD') // plain text
}

def projectPom = {
    name = projectName
    // artifactId can be defined here optionally
    description = 'A minimalistic, GC-free, stream-oriented JSON parser and generator.'
    url = 'https://github.com/green4j/green-jelly'

    scm {
        connection = 'scm:git:https://github.com/green4j/green-jelly.git'
        developerConnection = 'scm:git:https://github.com/green4j/green-jelly.git'
        url = 'https://github.com/green4j/green-jelly.git'
    }

    licenses {
        license {
            name = 'MIT License'
            url = 'https://opensource.org/licenses/MIT'
        }
    }

    developers {
        developer {
            id = 'anatolygudkov'
            name = 'Anatoly Gudkov'
            email = 'gudkovanatoly@hotmail.com'
            url = 'https://github.com/anatolygudkov'
        }
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    testImplementation "org.junit.jupiter:junit-jupiter:${jupiterVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    checkstyle "com.puppycrawl.tools:checkstyle:${checkstyleVersion}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(buildJavaVersion)
    }

    withSourcesJar()
    withJavadocJar()
}

checkstyle {
    toolVersion = "${checkstyleVersion}"
}

jacoco {
    toolVersion = "${jacocoVersion}"
}

compileJava {
    // --release rather than -source/-target: it also pins the API, and it keeps the "bootstrap class path
    // not set" note - which -Werror turns into a failure - off every JDK newer than the released one.
    options.release = jellySrcJavaVersion.majorVersion as Integer

    // -Xlint:all means a different set on every JDK. These two categories arrive on JDKs newer than the
    // released baseline and fire on code which is correct as written, so they are named out rather than
    // letting -Werror fail a build the release JDK passes.
    def lint = ['all']
    if (buildJavaVersion >= 21) {
        lint << '-this-escape'
    }
    if (buildJavaVersion >= 22) {
        lint << '-dangling-doc-comments'
    }

    options.compilerArgs.addAll(["-Xlint:${lint.join(',')}".toString(), '-Werror'])
    options.encoding = 'UTF-8'
    options.deprecation = true
}

compileTestJava {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes 'Implementation-Title': projectName,
                   'Implementation-Version': projectVersion,
                   'Implementation-Vendor' : projectAuthor
    }
    includeEmptyDirs = false
}

test {
    useJUnitPlatform()

    testLogging {
        events 'skipped', 'failed'
        showStandardStreams = true
        exceptionFormat = 'full'
        afterSuite { desc, result ->
            if (!desc.parent) {
                println "Results: ${result.resultType} (${result.testCount} tests, " +
                        "${result.successfulTestCount} successes, " +
                        "${result.failedTestCount} failures, " +
                        "${result.skippedTestCount} skipped)"
            }
        }
    }
}

check {
    dependsOn jacocoTestReport
}

javadoc {
    title = "<h1>${projectName}</h1>"
    options.bottom = "<i>Copyright &#169; 2018-2026 ${projectAuthor}. All Rights Reserved.</i>"
    options.encoding = 'UTF-8'
    options.docEncoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.addBooleanOption 'html5', true
    options.addStringOption('Xdoclint:all,-missing', '-quiet')
}

publishing {
    publications {
        greenJelly(MavenPublication) {
            from components.java
            pom(projectPom)
        }
    }

    repositories {
        maven {
            name = 'MavenCentral'
            url = sonatypeReleasesRepoUrl
            credentials {
                username = sonatypeUsername
                password = sonatypePassword
            }
        }
    }
}

signing {
    if (signingKey) {
        useInMemoryPgpKeys(signingKey, signingPassword)
    }
    sign publishing.publications.greenJelly
}

tasks.withType(Sign).configureEach {
    onlyIf {
        isRelease && gradle.taskGraph.hasTask(tasks.publish)
    }
}

tasks.register('uploadArtifactsToSonatypeCentralPortal', SonatypeCentralPortalUploadRepositoryTask) {
    portalUsername.set(sonatypeUsername)
    portalPassword.set(sonatypePassword)
    groupId.set(projectGroup)
    snapshotRelease.set(!isRelease)
}
